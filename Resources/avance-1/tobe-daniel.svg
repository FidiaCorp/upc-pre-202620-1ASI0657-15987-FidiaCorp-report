<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="710" viewBox="0 0 1420 710" role="img" aria-labelledby="title desc">
<title id="title">To-Be de Daniel Rojas</title>
<desc id="desc">Escenario propuesto, pendiente de validación. Cuatro fases con acciones, pensamientos y emociones esperadas.</desc>
<rect width="1420" height="710" fill="#f3f6fa"/>
<rect width="1420" height="128" fill="#163347"/>
<text x="30" y="40" font-family="Arial, sans-serif" font-size="16" fill="#7cd8ce" font-weight="700">CREDICASA  /  AVANCE 1</text>
<text x="30" y="79" font-family="Arial, sans-serif" font-size="30" fill="#ffffff" font-weight="700">To-Be · Daniel Rojas</text>
<text x="30" y="108" font-family="Arial, sans-serif" font-size="17" fill="#c9dce8" font-weight="400">Asesor inmobiliario · Propuesta preliminar, pendiente de validación</text>
<rect x="30" y="160" width="140" height="88" fill="#126b69" stroke="#cfdae3"/>
<text x="45" y="189" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">Phases</text>
<rect x="170" y="160" width="305" height="88" fill="#126b69" stroke="#cfdae3"/>
<text x="185" y="189" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">Atender al cliente</text>
<rect x="475" y="160" width="305" height="88" fill="#126b69" stroke="#cfdae3"/>
<text x="490" y="189" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">Preparar cotización</text>
<rect x="780" y="160" width="305" height="88" fill="#126b69" stroke="#cfdae3"/>
<text x="795" y="189" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">Explicar propuesta</text>
<rect x="1085" y="160" width="305" height="88" fill="#126b69" stroke="#cfdae3"/>
<text x="1100" y="189" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">Derivar al banco</text>
<rect x="30" y="248" width="140" height="156" fill="#e2edf2" stroke="#cfdae3"/>
<text x="45" y="277" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="700">Doing</text>
<rect x="170" y="248" width="305" height="156" fill="#ffffff" stroke="#cfdae3"/>
<text x="185" y="277" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">Reúne los datos necesarios del</text>
<text x="185" y="301" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">inmueble y del financiamiento;</text>
<text x="185" y="325" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">identifica información faltante.</text>
<rect x="475" y="248" width="305" height="156" fill="#ffffff" stroke="#cfdae3"/>
<text x="490" y="277" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">Reutiliza los datos, verifica</text>
<text x="490" y="301" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">fuente y fecha de parámetros y</text>
<text x="490" y="325" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">genera un escenario con versión</text>
<text x="490" y="349" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">identificable.</text>
<rect x="780" y="248" width="305" height="156" fill="#ffffff" stroke="#cfdae3"/>
<text x="795" y="277" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">Revisa con el comprador el</text>
<text x="795" y="301" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">desglose y las alternativas;</text>
<text x="795" y="325" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">conserva la versión elegida.</text>
<rect x="1085" y="248" width="305" height="156" fill="#ffffff" stroke="#cfdae3"/>
<text x="1100" y="277" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">Obtiene autorización para</text>
<text x="1100" y="301" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">compartir, entrega la cotización</text>
<text x="1100" y="325" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">identificada y registra el envío;</text>
<text x="1100" y="349" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">confirma recepción solo con</text>
<text x="1100" y="373" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">evidencia.</text>
<rect x="30" y="404" width="140" height="108" fill="#e2edf2" stroke="#cfdae3"/>
<text x="45" y="433" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="700">Thinking</text>
<rect x="170" y="404" width="305" height="108" fill="#edf4f7" stroke="#cfdae3"/>
<text x="185" y="433" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">¿Tengo los datos suficientes para</text>
<text x="185" y="457" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">una propuesta referencial?</text>
<rect x="475" y="404" width="305" height="108" fill="#edf4f7" stroke="#cfdae3"/>
<text x="490" y="433" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">¿Puedo explicar de dónde salen</text>
<text x="490" y="457" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">estas condiciones y reconstruir</text>
<text x="490" y="481" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">el cálculo?</text>
<rect x="780" y="404" width="305" height="108" fill="#edf4f7" stroke="#cfdae3"/>
<text x="795" y="433" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">¿El comprador comprende los pagos</text>
<text x="795" y="457" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">y el carácter referencial de la</text>
<text x="795" y="481" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">propuesta?</text>
<rect x="1085" y="404" width="305" height="108" fill="#edf4f7" stroke="#cfdae3"/>
<text x="1100" y="433" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">¿Qué envié, a quién y qué falta</text>
<text x="1100" y="457" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">para que la entidad lo evalúe?</text>
<rect x="30" y="512" width="140" height="108" fill="#e2edf2" stroke="#cfdae3"/>
<text x="45" y="541" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="700">Feeling</text>
<rect x="170" y="512" width="305" height="108" fill="#ffffff" stroke="#cfdae3"/>
<text x="185" y="541" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">Mayor orden al iniciar la</text>
<text x="185" y="565" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">atención.</text>
<rect x="475" y="512" width="305" height="108" fill="#ffffff" stroke="#cfdae3"/>
<text x="490" y="541" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">Confianza condicionada a</text>
<text x="490" y="565" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">parámetros verificables.</text>
<rect x="780" y="512" width="305" height="108" fill="#ffffff" stroke="#cfdae3"/>
<text x="795" y="541" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">Claridad para explicar y</text>
<text x="795" y="565" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">responder preguntas.</text>
<rect x="1085" y="512" width="305" height="108" fill="#ffffff" stroke="#cfdae3"/>
<text x="1100" y="541" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">Mayor control del seguimiento,</text>
<text x="1100" y="565" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">sin anticipar la decisión</text>
<text x="1100" y="589" font-family="Arial, sans-serif" font-size="17" fill="#183247" font-weight="400">bancaria.</text>
<text x="30" y="655" font-family="Arial, sans-serif" font-size="16" fill="#526878" font-weight="400">Hipótesis de diseño: las acciones y emociones aún no se han observado con participantes.</text>
<text x="30" y="681" font-family="Arial, sans-serif" font-size="16" fill="#526878" font-weight="400">Borrador local para revisar y trasladar a Lucidchart/Miro según la guía del curso.</text>
</svg>
